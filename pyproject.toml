[project]
name = "cyber-security-systems"
version = "0.1.0"
description = "Local evidence-backed synthetic industrial access-path analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "networkx>=3.4,<4",
]

[project.scripts]
cyber-path = "cyber_security_systems.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
